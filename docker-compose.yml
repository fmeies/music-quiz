# Pull-only on purpose: without build, a failed pull errors out instead of silently
# falling back to a slow local build. To test local changes, see README.
services:
  server:
    image: ghcr.io/fmeies/music-quiz:latest
    env_file: ./server/.env
    ports:
      - "127.0.0.1:3011:3011"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:3011/verify?code=_', r => process.exit(r.statusCode === 200 ? 0 : 1)).on('error', () => process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
